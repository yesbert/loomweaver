# SonarQube analysis, on a schedule and on main.
#
# Never on a pull request. The scanner needs a token, a fork's run gets no secrets, and a workflow
# that quietly does nothing on half the pull requests is worse than one that does not claim to run
# on them at all. Analysis after the merge is what this repository did before the move too.
name: SonarQube

on:
  schedule:
    - cron: "0 2 * * *"
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyse:
    name: Analyse
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # Sonar assigns new issues to the commit that introduced them, which needs the history.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: platform/package-lock.json

      - name: Install dependencies
        working-directory: platform
        run: npm install

      - name: Unit tests with coverage
        working-directory: platform
        run: npx nx run-many --target=test --all --configuration=ci

      # Pinned to a commit rather than a tag: a tag can be moved, and this step is handed a token.
      - name: Scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8
        with:
          # The lcov reports name their files relative to platform/, so the scan has to start there
          # or every covered path goes unresolved.
          projectBaseDir: platform
          # Wait for the server's verdict instead of ending at "uploaded". Without this the job is
          # green whatever the analysis found, which is worse than no analysis: it looks like a check.
          args: -Dsonar.qualitygate.wait=true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

      # Which gate condition failed, and what the analysis found, in the log, so the answer does not
      # require opening Sonar. Runs even when the gate failed the step above, hence always().
      - name: Report what was found
        if: always()
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        run: |
          set -euo pipefail

          ask() { curl -sf -u "${SONAR_TOKEN}:" "${SONAR_HOST_URL}/api/$1"; }
          project="${SONAR_HOST_URL}/project/issues?id=loomweaver&resolved=false"
          gate=$(ask "qualitygates/project_status?projectKey=loomweaver")

          # A failed gate leaves the scanner exiting 3, and the action can only report that number.
          # Say what actually broke, as an annotation, next to the one nobody can read.
          failed=$(printf '%s' "${gate}" | jq -r '
            [.projectStatus.conditions[]
             | select(.status != "OK")
             | "\(.metricKey) is \(.actualValue), gate wants \(.comparator) \(.errorThreshold)"]
            | join("; ")')
          if [ -n "${failed}" ]; then
            echo "::error title=SonarQube quality gate failed::${failed}"
          fi

          {
            echo "## SonarQube"
            echo
            echo "[Dashboard](${SONAR_HOST_URL}/dashboard?id=loomweaver) ·"
            echo "[Open issues](${project}) ·"
            echo "[Security hotspots](${SONAR_HOST_URL}/security_hotspots?id=loomweaver)"
            echo

            echo "### Quality gate"
            echo
            echo "| | condition | actual | gate wants |"
            echo "|---|---|---|---|"
            printf '%s' "${gate}" | jq -r '
              .projectStatus.conditions[]
              | "| \(if .status == "OK" then "✅" else "❌" end) | \(.metricKey) | \(.actualValue) | \(.comparator) \(.errorThreshold) |"'
            echo

            echo "### Measures"
            echo
            echo "| metric | value |"
            echo "|---|---|"
            metrics=ncloc,coverage,violations,bugs,vulnerabilities,code_smells,security_hotspots
            ask "measures/component?component=loomweaver&metricKeys=${metrics}" \
              | jq -r '.component.measures | sort_by(.metric)[] | "| \(.metric) | \(.value) |"'
            echo

            # The newer parameter is `components`; older servers only know `componentKeys`.
            issues=$(ask "issues/search?components=loomweaver&resolved=false&ps=100" || true)
            if ! printf '%s' "${issues}" | jq -e '.issues' >/dev/null 2>&1; then
              issues=$(ask "issues/search?componentKeys=loomweaver&resolved=false&ps=100" || true)
            fi
            if printf '%s' "${issues}" | jq -e '.issues | length > 0' >/dev/null 2>&1; then
              total=$(printf '%s' "${issues}" | jq -r '.total')
              shown=$(printf '%s' "${issues}" | jq -r '.issues | length')
              echo "<details><summary>Open issues: showing ${shown} of ${total} — <a href=\"${project}\">all of them in Sonar</a></summary>"
              echo
              echo "| severity | where | rule | message |"
              echo "|---|---|---|---|"
              printf '%s' "${issues}" | jq -r --arg host "${SONAR_HOST_URL}" '
                .issues[]
                | "| \(.severity // "-") | [\(.component | sub("^[^:]*:"; ""))\(if .line then ":\(.line)" else "" end)](\($host)/project/issues?id=loomweaver&open=\(.key)) | \(.rule) | \(.message | gsub("\\|"; "\\|")) |"'
              echo
              echo "</details>"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

          cat "${GITHUB_STEP_SUMMARY}"
