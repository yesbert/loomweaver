# Publish the seven packages to npm. Version tags only.
#
# The tag is the deliberate "release this" signal: create it with scripts/bump-version.sh, which
# stamps Directory.Build.props and every manifest, then push it. A push to a branch never publishes.
#
# The job authenticates to npm over OIDC (trusted publishing), which also gives every package a
# provenance attestation a consumer can verify. That is configured per package on npmjs.com, naming
# this repository, this workflow file and the release environment. No npm token is stored.
name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A published version cannot be taken back, and there is deliberately no required reviewer here:
    # an approval gate would stop the autonomous cadence this repository runs on. What stands in its
    # place is that publishing takes an act nothing else performs — pushing a v* tag — plus this
    # environment's branch policy and the version check against the tag below. The tag push is the
    # point of no return, not the merge.
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      # The whole history, so the check below can tell whether the tagged commit is on main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Only what main carries is published. A tag pushed on a branch commit would publish code no
      # review merged, and the environment's branch policy cannot tell, because it sees only the tag.
      - name: Refuse a tag that is not on main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::${GITHUB_REF#refs/tags/} points at ${GITHUB_SHA}, which main does not contain. Tag a commit on main." >&2
            exit 1
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: platform/package-lock.json

      # Trusted publishing needs npm 11.5.1 or newer, and a runner image can carry an older npm than
      # the Node release it installs ships with. A fixed version, because the npm that publishes is
      # part of what a release is made with, and "latest" would change it between two runs.
      - name: Use an npm that can publish over OIDC
        run: npm install -g npm@11.20.0

      # The tag is the version, and the working tree has to agree with it. A tag that disagrees with
      # Directory.Build.props means the bump and the tag drifted apart, and publishing either of them
      # would be a guess.
      - name: Resolve and verify the version
        id: version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/v}"
          props="$(sed -n 's/.*<Version>\([^<]*\)<\/Version>.*/\1/p' Directory.Build.props)"
          if [[ "${tag}" != "${props}" ]]; then
            echo "Tag v${tag} disagrees with Directory.Build.props <Version>${props}</Version>." >&2
            echo "Bump with scripts/bump-version.sh so the tag and the manifests match, then re-tag." >&2
            exit 1
          fi
          # The dist-tag is read out of the version, never passed alongside it: a preview that
          # reached "latest" would be what every plain install resolves to, and a published version
          # cannot be withdrawn. scripts/dist-tag.mjs owns that rule, so it lives in one place and
          # can be exercised without a release.
          dist="$(node scripts/dist-tag.mjs "${tag}")"
          echo "value=${tag}" >> "$GITHUB_OUTPUT"
          echo "dist=${dist}" >> "$GITHUB_OUTPUT"
          echo "Publishing version ${tag} to dist-tag ${dist}"

      - name: Install dependencies
        working-directory: platform
        run: npm install

      # Separately and in order, not with run-many: co-building parallelises Nx' buildable-lib path
      # rewriting, which breaks ng-packagr's resolution of the SDK from the shell.
      - name: Pack the libraries
        working-directory: platform
        run: |
          set -euo pipefail
          npx nx package plugin-sdk
          npx nx package shell
          npx nx run shell:styles
          npx nx package devkit
          npx nx package ag-ui

      # Some packages publish from platform/dist, the others from their source directory with a
      # bundled dist; the table in platform/tools/published-packages.mjs says which, and the manifest
      # in the folder each one publishes from is the one that gets stamped.
      - name: Stamp the version into every manifest
        env:
          PKG_VERSION: ${{ steps.version.outputs.value }}
        run: node scripts/release-packages.mjs stamp "${PKG_VERSION}"

      # Bundled after stamping, so the version baked into each bundle is the released one.
      - name: Bundle the three that publish from source
        working-directory: platform
        run: |
          set -euo pipefail
          npx nx bundle frame-kit --skip-nx-cache
          npx nx bundle mcp --skip-nx-cache
          npx nx bundle cli --skip-nx-cache

      # A package whose trusted publisher is missing, or names another workflow or environment, fails
      # at its own npm publish, after the packages before it are already out, and a published version
      # cannot be withdrawn. So the exchange npm publish performs is tried for every package first,
      # and the release stops before anything is published.
      - name: Check that npm trusts this workflow for every package
        run: |
          set -euo pipefail
          id_token="$(curl -sSf \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org" | jq -r .value)"
          echo "::add-mask::${id_token}"
          untrusted=0
          for pkg in $(node scripts/release-packages.mjs names); do
            status="$(curl -s -o /dev/null -w '%{http_code}' -X POST \
              -H "Authorization: Bearer ${id_token}" \
              "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/${pkg/\//%2f}")"
            if [[ "${status}" == 2* ]]; then
              echo "npm trusts this workflow for ${pkg}"
            else
              echo "::error::npm does not trust this workflow for ${pkg} (HTTP ${status})"
              untrusted=1
            fi
          done
          exit "${untrusted}"

      - name: Publish
        env:
          DIST_TAG: ${{ steps.version.outputs.dist }}
        run: |
          set -euo pipefail
          for dir in $(node scripts/release-packages.mjs roots); do
            echo "publishing ${dir} to ${DIST_TAG}"
            ( cd "${dir}" && npm publish --tag "${DIST_TAG}" )
          done

  announce:
    name: Release notes
    # Only after the packages are actually on npm: a release page for a version nobody can install
    # is a lie, and this is the page a consumer reaches from the npm listing.
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      # The whole history, because the notes need the tag before this one and a shallow clone has
      # no tags to look back at.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Create the release page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          # Whether this is a preview is read out of the version by the same script the dist-tag
          # comes from, so the rule lives in one place. A preview must not be GitHub's "Latest"
          # for the same reason it must not be npm's.
          dist="$(node scripts/dist-tag.mjs "${tag#v}")"
          notes=(--generate-notes)
          # What a minor release asks of a product goes above the list of pull requests, taken from
          # the section docs/updating.md keeps for it, so the page and the guide say the same thing.
          node scripts/update-notes.mjs "${tag#v}" > update-notes.md
          if [[ -s update-notes.md ]]; then
            notes+=(--notes-file update-notes.md)
          fi
          if [[ "${dist}" != "latest" ]]; then
            notes+=(--prerelease)
          fi
          # Name the tag the notes start from. Left out, GitHub looks for the previous *release*,
          # and there is none before this job existed, so the first page would have covered the
          # whole history.
          previous="$(git describe --tags --abbrev=0 "${tag}^" 2>/dev/null || true)"
          if [[ -n "${previous}" ]]; then
            notes+=(--notes-start-tag "${previous}")
          fi
          # The notes are generated from the pull requests merged since the previous tag. They are a
          # view of what is already written there rather than a second list to keep true, which is
          # why this repository has no CHANGELOG.md.
          gh release create "${tag}" --title "${tag}" "${notes[@]}"
