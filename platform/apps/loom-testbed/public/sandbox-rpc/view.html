<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sandbox (RPC)</title>
    <link rel="stylesheet" href="/frame-kit/lw-frame.css" />
    <style>
      body {
        padding: 2.5rem;
        line-height: 1.6;
      }
      .badge {
        position: relative;
        display: inline-block;
        padding: 0.25rem 0.6rem;
        border-radius: 999px;
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.02em;
        color: var(--lw-on-brand);
        background: var(--lw-brand);
      }
      h1 {
        margin: 0.75rem 0 1rem;
        font-size: 1.5rem;
      }
      code {
        padding: 0.1rem 0.35rem;
        border-radius: 4px;
        background: color-mix(in srgb, var(--lw-brand) 12%, transparent);
        font-size: 0.9em;
      }
      .tabs {
        display: flex;
        gap: 0.25rem;
        border-bottom: 1px solid var(--lw-border);
        margin-bottom: 1rem;
      }
      .tab {
        appearance: none;
        border: 0;
        background: none;
        cursor: pointer;
        padding: 0.4rem 0.9rem;
        font: inherit;
        font-size: 0.9rem;
        color: var(--lw-content-muted);
        border-bottom: 2px solid transparent;
        margin-bottom: -1px;
      }
      .tab[aria-selected='true'] {
        color: var(--lw-brand);
        border-bottom-color: var(--lw-brand);
        font-weight: 600;
      }
      .keep {
        appearance: none;
        cursor: pointer;
        margin-left: 0.75rem;
        padding: 0.15rem 0.6rem;
        border-radius: 999px;
        border: 1px solid var(--lw-brand);
        background: none;
        color: var(--lw-brand);
        font: inherit;
        font-size: 0.72rem;
        font-weight: 600;
      }
      .kit-strip {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        margin-top: 1.25rem;
        padding: 0.75rem 1rem;
        border: 1px solid var(--lw-border);
        border-radius: 0.5rem;
      }
      .note {
        font-size: 0.85rem;
        color: var(--lw-content-muted);
      }
      .spaced {
        margin-top: 1.25rem;
      }
      .admin {
        margin-top: 0.75rem;
        padding: 0.6rem 0.8rem;
        border-radius: 0.375rem;
        background: color-mix(in srgb, var(--lw-brand) 12%, transparent);
      }
      .field {
        display: block;
        margin-top: 1rem;
        font-size: 0.85rem;
      }
      .field input {
        margin-top: 0.35rem;
        width: 100%;
      }
      .check {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        margin-top: 1rem;
        font-size: 0.85rem;
      }
      .ctx-note {
        display: block;
        margin-top: 1rem;
        min-height: 1.2rem;
        font-size: 0.85rem;
        color: var(--lw-content-muted);
      }
      .veto {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        background: color-mix(in srgb, var(--lw-scrim) 60%, transparent);
      }
      .veto-question {
        padding: 0.6rem 1rem;
        border-radius: 0.375rem;
        background: var(--lw-surface-raised);
      }
      .veto-buttons {
        display: flex;
        gap: 0.5rem;
      }
    </style>
  </head>
  <body>
    <main>
      <span class="badge">
        <span data-text="badge"></span>
        <lw-tooltip data-tooltip="badgeTip" position="bottom"></lw-tooltip>
      </span>
      <button
        class="keep"
        type="button"
        data-keep
        data-text="keep"
        hidden
      ></button>
      <h1 data-text="title"></h1>
      <p data-text="hint"></p>
      <div class="tabs" role="tablist">
        <button
          class="tab"
          type="button"
          role="tab"
          data-tab="overview"
          data-text="tab.overview"
        ></button>
        <button
          class="tab"
          type="button"
          role="tab"
          data-tab="architecture"
          data-text="tab.architecture"
        ></button>
      </div>
      <div class="body" id="tab-body"></div>

      <p class="note spaced" data-text="kitHint"></p>
      <div class="kit-strip" data-testid="frame-kit-strip">
        <lw-icon
          name="plugin"
          size="1.25rem"
          aria-hidden="true"
          data-testid="frame-kit-icon"
        ></lw-icon>
        <lw-icon
          name="testbed-sparkle"
          size="1.25rem"
          aria-hidden="true"
          data-testid="frame-kit-own-icon"
        ></lw-icon>
        <lw-button variant="primary" size="sm" data-testid="frame-kit-button"
          ><span data-text="kitButton"></span
        ></lw-button>
        <span class="lw-badge lw-badge--brand" data-testid="frame-kit-badge"
          >kit</span
        >
        <lw-progress-ring
          value="72"
          max="100"
          size="2rem"
          aria-label="72%"
          data-testid="frame-kit-ring"
        ></lw-progress-ring>
      </div>
      <lw-nav-tree current="dashboard/trends" data-testid="frame-kit-nav">
        <lw-nav-group label="Dashboard" key="sandbox/dashboard">
          <lw-nav-item
            path="dashboard/overview"
            icon="plugin"
            label="Overview"
          ></lw-nav-item>
          <lw-nav-item
            path="dashboard/trends"
            icon="plugin"
            label="Trends"
          ></lw-nav-item>
        </lw-nav-group>
        <lw-nav-item path="search" icon="plugin" label="Search"></lw-nav-item>
      </lw-nav-tree>

      <p class="note">
        <span data-text="session"></span>:
        <strong data-testid="sandbox-session"></strong>
      </p>
      <p class="note">
        <span data-text="ticking"></span
        ><strong data-testid="sandbox-onscreen">0</strong
        ><span id="idle" data-text="idle" hidden></span>
      </p>
      <p
        class="admin"
        data-testid="sandbox-admin"
        data-text="adminOnly"
        hidden
      ></p>

      <label class="field">
        <span data-text="draft.label"></span>
        <input
          type="text"
          class="lw-field"
          data-testid="sandbox-draft"
          data-placeholder="draft.placeholder"
        />
      </label>
      <label class="check">
        <input
          type="checkbox"
          class="lw-checkbox"
          data-testid="sandbox-veto-toggle"
        />
        <span data-text="veto.label"></span>
      </label>
      <label class="field">
        <span data-text="shared"></span>
        <input type="text" class="lw-field" data-testid="sandbox-scratch" />
      </label>
      <p class="note spaced" data-text="ctxHint"></p>
    </main>
    <output id="ctx-note" class="ctx-note"></output>
    <script src="/frame-kit/penpal.global.js"></script>
    <script src="/frame-kit/lw-elements.global.js"></script>
    <script src="./view-strings.js"></script>
    <script src="./close-veto.js"></script>
    <script src="./context-menu.js"></script>
    <script src="./view.js"></script>
  </body>
</html>
