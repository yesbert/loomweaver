# Analysed from platform/ rather than the repository root, because the lcov reports name their files
# relative to this directory. With the root as the base, Sonar resolved none of the 63 covered paths
# and silently reported no coverage at all.

sonar.projectKey=loomweaver
sonar.projectName=LoomWeaver

sonar.sources=apps,libs
sonar.tests=apps,libs
sonar.test.inclusions=**/*.spec.ts
sonar.exclusions=**/node_modules/**,**/dist/**,**/*.spec.ts,**/vite.config.*,**/*.conf.*
sonar.coverage.exclusions=**/*.spec.ts,**/main.ts,**/*.config.ts,apps/loom-testbed-e2e/**,apps/loom-testbed/public/**
sonar.javascript.lcov.reportPaths=coverage/**/lcov.info
sonar.typescript.lcov.reportPaths=coverage/**/lcov.info

# Rule exemptions, each tied to one file and kept beside its reason.
sonar.issue.ignore.multicriteria=iframeBypass,statusAuth,statusRoute,splitterSep,splitterTab,barTray,paletteListbox,paletteInteractive,paletteMouse,aboutMouse,formDialogMouse,tabStripMouse

# The sandbox iframe deliberately omits allow-same-origin; that is the isolation, not a mistake.
sonar.issue.ignore.multicriteria.iframeBypass.ruleKey=typescript:S6268
sonar.issue.ignore.multicriteria.iframeBypass.resourceKey=**/regions/content/surface/iframe-surface.ts

# A status region is announced by its role, and these templates carry it on a container that Sonar
# reads as needing an interactive element.
sonar.issue.ignore.multicriteria.statusAuth.ruleKey=Web:S6819
sonar.issue.ignore.multicriteria.statusAuth.resourceKey=**/regions/content/access/auth-required-view.html
sonar.issue.ignore.multicriteria.statusRoute.ruleKey=Web:S6819
sonar.issue.ignore.multicriteria.statusRoute.resourceKey=**/regions/content/access/route-unavailable-view.html
sonar.issue.ignore.multicriteria.splitterSep.ruleKey=Web:S6819
sonar.issue.ignore.multicriteria.splitterSep.resourceKey=**/regions/panel/panel-splitter.html

# The bar's overflow tray is a labelled region a button discloses through aria-expanded and
# aria-controls. Every element the rule offers instead would break that: <details> brings a second
# disclosure beside the button, <fieldset> and <optgroup> belong to forms and selects.
sonar.issue.ignore.multicriteria.barTray.ruleKey=Web:S6819
sonar.issue.ignore.multicriteria.barTray.resourceKey=**/regions/bar/shell-bar.html

# The splitter is keyboard-operable through its own handlers, which Sonar cannot see from markup.
sonar.issue.ignore.multicriteria.splitterTab.ruleKey=Web:S6845
sonar.issue.ignore.multicriteria.splitterTab.resourceKey=**/regions/panel/panel-splitter.html

# The command palette is a listbox driven from the input above it; the options are not tab stops by
# design, and every mouse action has a keyboard equivalent on the input.
sonar.issue.ignore.multicriteria.paletteListbox.ruleKey=Web:S6819
sonar.issue.ignore.multicriteria.paletteListbox.resourceKey=**/commands/palette/command-palette.html
sonar.issue.ignore.multicriteria.paletteInteractive.ruleKey=Web:S6842
sonar.issue.ignore.multicriteria.paletteInteractive.resourceKey=**/commands/palette/command-palette.html
sonar.issue.ignore.multicriteria.paletteMouse.ruleKey=Web:MouseEventWithoutKeyboardEquivalentCheck
sonar.issue.ignore.multicriteria.paletteMouse.resourceKey=**/commands/palette/command-palette.html
sonar.issue.ignore.multicriteria.aboutMouse.ruleKey=Web:MouseEventWithoutKeyboardEquivalentCheck
sonar.issue.ignore.multicriteria.aboutMouse.resourceKey=**/dialogs/testbed-about-dialog.html
# The two buttons of the testbed's form dialog are <lw-button> elements, which handle Enter and
# Space themselves; Sonar reads the click handler on an element it does not know as mouse-only.
sonar.issue.ignore.multicriteria.formDialogMouse.ruleKey=Web:MouseEventWithoutKeyboardEquivalentCheck
sonar.issue.ignore.multicriteria.formDialogMouse.resourceKey=**/dialogs/testbed-form-dialog.html

# The pin and close affordances on a tab are aria-hidden decorations over commands the keyboard
# already reaches: "shell.tab.close" and "shell.tab.togglePin" run from the command palette and
# from the tab's own context menu.
sonar.issue.ignore.multicriteria.tabStripMouse.ruleKey=Web:MouseEventWithoutKeyboardEquivalentCheck
sonar.issue.ignore.multicriteria.tabStripMouse.resourceKey=**/regions/pane/chrome/pane-tab-strip.html
