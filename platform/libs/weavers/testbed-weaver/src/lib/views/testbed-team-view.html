<div class="flex flex-col gap-3">
  <p class="text-sm text-content-muted">
    {{ 'testbed.team.intro' | transloco }}
  </p>
  <ol class="flex flex-col gap-3">
    @for (assignee of assignees; track assignee.id) {
      <li class="flex flex-col gap-1">
        <span class="flex items-baseline justify-between text-sm">
          <span class="text-content">{{ assignee.name }}</span>
          <span class="text-xs text-content-faint">
            {{ 'testbed.team.open' | transloco: { count: assignee.open } }}
          </span>
        </span>
        <span class="h-2 w-full overflow-hidden rounded-full bg-surface">
          <span class="block h-full rounded-full bg-brand" [style.width.%]="assignee.percent"></span>
        </span>
      </li>
    }
  </ol>
</div>
