<div class="flex flex-col items-center gap-3 text-center">
  <img [src]="identity.logoUrl" [alt]="identity.name" class="h-14 w-14 rounded-xl" />
  <div class="flex flex-col gap-1">
    <h2 class="text-lg font-semibold text-content">{{ identity.name }}</h2>
    <p class="text-sm text-content-muted">{{ identity.tagline | transloco }}</p>
  </div>
  <span class="text-xs text-content-muted tabular-nums">v{{ host.version() }}</span>
  @if (host.updatesEnabled) {
    <lw-button variant="default" (click)="onUpdate()">
      {{ (host.updateAvailable() ? 'update.reload' : 'update.check') | transloco }}
    </lw-button>
  }
</div>
