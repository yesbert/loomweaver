<div class="mx-auto flex max-w-2xl flex-col gap-3">
  <h2 class="text-lg font-semibold text-content">
    {{ 'testbed.notes.heading' | transloco }}
  </h2>
  <textarea
    rows="6"
    [attr.placeholder]="'testbed.notes.title' | transloco"
    class="rounded-md border border-border bg-surface px-3 py-2 text-sm text-content outline-none focus:border-brand"
    [value]="draft()"
    (input)="onInput($event)"
  ></textarea>
  <p class="text-sm text-content-faint">
    {{ 'testbed.notes.intro' | transloco }}
  </p>
</div>
