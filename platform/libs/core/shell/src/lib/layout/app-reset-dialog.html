<div class="flex flex-col gap-4">
  <p class="whitespace-pre-line text-sm text-content">
    {{ 'appReset.confirm' | transloco }}
  </p>

  @if (offersWorkspaces) {
    <label class="flex items-start gap-2 text-sm">
      <input
        type="checkbox"
        class="lw-checkbox mt-0.5"
        [checked]="workspaces()"
        (change)="toggleWorkspaces($event)"
        data-testid="app-reset-workspaces"
      />
      <span class="flex flex-col gap-0.5">
        <span>{{ 'appReset.includeWorkspaces' | transloco }}</span>
        <span class="text-xs text-content-faint">
          {{ 'appReset.includeWorkspacesHint' | transloco }}
        </span>
      </span>
    </label>
  }

  <div class="flex justify-end gap-2">
    <button type="button" class="lw-btn" (click)="cancel()">
      {{ 'dialog.cancel' | transloco }}
    </button>
    <button
      type="button"
      class="lw-btn lw-btn--primary"
      (click)="confirm()"
      data-testid="app-reset-confirm"
    >
      {{ 'appReset.title' | transloco }}
    </button>
  </div>
</div>
