<lw-select
  [attr.label]="'language.label' | transloco"
  [attr.value]="lang()"
  [attr.compact]="compact() ? '' : null"
  (lw-select-change)="onSelect($event)"
>
  @for (language of langs; track language.value) {
  <lw-option [attr.value]="language.value" [attr.icon]="language.flag"
    >{{ language.label }}</lw-option
  >
  }
</lw-select>
