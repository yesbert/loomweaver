<lw-select
  [attr.label]="'language.label' | transloco"
  [attr.value]="lang()"
  [attr.compact]="compact() ? '' : null"
  (lw-select-change)="onSelect($event)"
>
  @for (l of langs; track l.value) {
  <lw-option [attr.value]="l.value" [attr.icon]="l.flag"
    >{{ l.label }}</lw-option
  >
  }
</lw-select>
