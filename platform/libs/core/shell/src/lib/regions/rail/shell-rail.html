<nav
  class="flex h-full shrink-0 flex-col items-center gap-1 bg-surface py-2"
  [class]="labelled() ? 'w-18' : 'w-10'"
  [attr.aria-label]="labelKey() | transloco"
  cdkDropList
  cdkDropListOrientation="vertical"
  [id]="dropListId()"
  [cdkDropListConnectedTo]="connectedRails()"
  [cdkDropListDisabled]="!draggable()"
  [cdkDropListSortingDisabled]="!reorderable()"
  [cdkDropListEnterPredicate]="enterPredicate"
  [cdkDropListSortPredicate]="sortPredicate"
  (cdkDropListDropped)="onDrop($event)"
  [lwReorderable]="containerId()"
  [lwReorderableEnabled]="reorderable()"
  (reorder)="onReorder($event)"
  [lwMenu]="railMenu()"
>
  <div
    cdkScrollable
    data-testid="rail-scroll"
    class="flex min-h-0 w-full flex-1 flex-col items-center gap-1 overflow-x-hidden overflow-y-auto"
  >
    @for (item of topItems(); track item.id) {
      <ng-container [ngTemplateOutlet]="entry" [ngTemplateOutletContext]="{ $implicit: item }" />
    }
  </div>

  @if (bottomItems().length > 0) {
    <div
      data-testid="rail-anchored"
      class="flex w-full shrink-0 flex-col items-center gap-1"
    >
      @for (item of bottomItems(); track item.id) {
        <ng-container [ngTemplateOutlet]="entry" [ngTemplateOutletContext]="{ $implicit: item }" />
      }
    </div>
  }

  <ng-template #entry let-item>
    <button
      type="button"
      cdkDrag
      [cdkDragData]="item.id"
      [cdkDragDisabled]="!draggable()"
      [disabled]="disabled(item)"
      (click)="run(item)"
      (keydown)="onKeydown($event)"
      (focus)="onFocus($event)"
      [lwMenu]="menusFor(item)"
      [lwMenuOnActivate]="activateMenuFor(item)"
      [lwMenuHeader]="item.menuHeader"
      [lwMenuSide]="menuSide()"
      [lwMenuContext]="{ targetKind: 'rail-item', id: item.id, region: region().id }"
      [attr.aria-label]="item.title | transloco"
      [attr.aria-current]="current(item) ? 'true' : null"
      [attr.data-rail-item]="item.id"
      [attr.data-reorder-id]="reorderable() ? item.id : null"
      [attr.data-reorder-band]="item.anchor ?? 'top'"
      [class.text-content]="current(item)"
      [class.bg-surface-overlay]="current(item)"
      [class]="labelled() ? 'w-16 flex-col gap-1 px-1 py-1.5' : 'h-9 w-9'"
      class="relative flex shrink-0 items-center justify-center rounded-lg text-content-faint transition-colors hover:bg-surface-overlay hover:text-content disabled:pointer-events-none disabled:opacity-40"
    >
      @if (current(item)) {
        <span
          aria-hidden="true"
          class="absolute inset-y-1 w-0.5 rounded-full bg-brand"
          [class.left-0]="region().dock !== 'right'"
          [class.right-0]="region().dock === 'right'"
        ></span>
      }
      @if (pictureOf(item); as picture) {
        <img
          [src]="picture"
          alt=""
          aria-hidden="true"
          data-testid="rail-picture"
          class="lw-chrome-picture h-6 w-6"
          (error)="onPictureError(item)"
        />
      } @else if (item.initials) {
        <span
          aria-hidden="true"
          data-testid="rail-initials"
          class="lw-rail-initials"
          >{{ item.initials }}</span
        >
      } @else {
        <lw-icon [name]="item.icon" [attr.size]="labelled() ? '1.25rem' : '1rem'" />
      }
      @if (labelled()) {
        <span
          #railLabel
          data-testid="rail-label"
          [attr.data-rail-label]="item.id"
          class="line-clamp-2 w-full text-center text-[0.625rem] leading-tight break-words"
          >{{ item.title | transloco }}</span
        >
      }
      @if (!labelled() || shortened(item.id)) {
        <lw-tooltip [text]="item.title | transloco" [position]="region().dock === 'right' ? 'left' : 'right'" />
      }
    </button>
  </ng-template>
</nav>
