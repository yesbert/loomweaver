@let named = !title ? ('content.pluginSurface' | transloco) : literalTitle ? title : (title | transloco);
@if (isolated) {
  <iframe
    #frame
    class="h-full w-full border-0"
    [src]="src"
    sandbox="allow-scripts"
    [title]="named"
  ></iframe>
} @else {
  <iframe
    #frame
    class="h-full w-full border-0"
    [src]="src"
    [title]="named"
  ></iframe>
}
