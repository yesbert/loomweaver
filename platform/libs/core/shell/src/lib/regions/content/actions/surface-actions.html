@if (actions().length) {
  <div
    class="flex shrink-0 items-center gap-0.5"
    [class.border-l]="inStrip()"
    [class.border-border]="inStrip()"
    [class.px-2]="inStrip()"
    data-testid="surface-actions"
  >
    @for (entry of actions(); track entry.item.id) {
      <button
        type="button"
        (click)="run(entry)"
        [disabled]="entry.disabled"
        [lwMenu]="contextMenuOf(entry.item)"
        [lwMenuOnActivate]="entry.opensMenu"
        [lwMenuHeader]="entry.item.menuHeader"
        [lwMenuContext]="contextOf(entry.item)"
        class="lw-icon-btn rounded-md disabled:pointer-events-none disabled:opacity-40"
        [class.h-8]="inStrip()"
        [class.w-8]="inStrip()"
        [class.h-10]="!inStrip()"
        [class.w-10]="!inStrip()"
        [class.md:h-7]="!inStrip()"
        [class.md:w-7]="!inStrip()"
        [attr.aria-label]="entry.item.title | transloco"
        [attr.aria-pressed]="entry.item.pressed"
        [attr.data-surface-action]="entry.item.id"
      >
        <lw-icon [name]="entry.item.icon" size="1rem" />
        <lw-tooltip [text]="entry.item.title | transloco" position="bottom" />
      </button>
    }
  </div>
}
