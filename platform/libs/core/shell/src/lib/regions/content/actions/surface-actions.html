@if (slot(); as slot) {
  @let label = title();
  <lw-toolbar
    [attr.menu]="slot"
    [attr.label]="label ? (label.literalTitle ? label.title : (label.title | transloco)) : null"
    [attr.size]="inStrip() ? 'sm' : 'md'"
    [context]="context()"
    [class.border-l]="inStrip()"
    [class.border-border]="inStrip()"
    [class.px-2]="inStrip()"
    data-testid="surface-actions"
  ></lw-toolbar>
}
