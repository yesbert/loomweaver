@if (slot(); as slot) {
  <lw-toolbar
    [attr.menu]="slot"
    [attr.label]="title()"
    [attr.size]="inStrip() ? 'sm' : 'md'"
    [context]="context()"
    [class.border-l]="inStrip()"
    [class.border-border]="inStrip()"
    [class.px-2]="inStrip()"
    data-testid="surface-actions"
  ></lw-toolbar>
}
