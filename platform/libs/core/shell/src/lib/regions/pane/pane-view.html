@if (carriesAddress()) {
  <lw-address-pane-header />
} @else {
  <lw-pane-tab-strip
    class="shrink-0"
    [variant]="options().variant"
    [tabs]="stripTabs()"
    [activeId]="activeTabId()"
    [urlDriven]="pointed()"
    [source]="pane()"
    [reorderable]="tabsReorderable()"
    [draggable]="tabsDraggable()"
    [acceptsTabs]="acceptsTabs()"
    [canAddTab]="canAddTab()"
    [contextMenuSlot]="tabContextMenu()"
    [viewContextMenuSlot]="viewContextMenu()"
    [contextGroup]="dock()"
    [paneActions]="paneActions"
    (selectTab)="onSelectTab($event)"
    (escalate)="onEscalate($event)"
    (closeTab)="onCloseTab($event)"
    (unpinTab)="onUnpinTab($event)"
    (addTab)="openPicker($event)"
    (reorderTabs)="onReorderTabs($event)"
  />
}
<ng-template #paneActions>
  <lw-pane-toolbar
    [canSplitRight]="canSplitRight()"
    [canSplitDown]="canSplitDown()"
    [canMinimize]="canMinimize()"
    [canMaximize]="canMaximize()"
    [maximized]="maximized()"
    [canClose]="canClose()"
    [closeLabel]="options().closeLabel"
    (splitRight)="splitPane('row')"
    (splitDown)="splitPane('column')"
    (minimize)="minimize()"
    (toggleMaximize)="toggleMaximize()"
    (closePane)="closePane()"
  />
</ng-template>

<div
  class="relative flex min-h-0 min-w-0 flex-1 flex-col outline-none"
  [attr.id]="carriesAddress() ? 'lw-main-content' : null"
  [attr.role]="carriesAddress() ? 'main' : null"
  [attr.tabindex]="carriesAddress() ? -1 : null"
  (pointerdown)="onBodyPointerDown()"
>
  @if (carriesAddress()) {
    <router-outlet />
    <lw-unusable-workspace-notice />
  }
  @if (awaitingContent()) {
    <output
      class="flex h-full items-center justify-center p-6 text-center text-sm text-content-faint"
      data-testid="pane-awaiting-content"
    >
      {{ 'content.split.awaiting' | transloco }}
    </output>
  } @else if (showsSurface()) {
    <lw-surface-body
      class="min-h-0 min-w-0 flex-1"
      [path]="bodyPath()"
      [instanceId]="bodyInstance()"
      [variant]="options().body"
      [retentionScope]="retentionScope()"
      [carriesAddress]="carriesAddress()"
      (instanceReleased)="releaseTabInstance()"
    />
  }
</div>
