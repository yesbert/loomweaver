@if (fills()) {
  @if (accepts()) {
    <div
      class="lw-pane-drop-zone col-span-3 col-start-1 row-span-3 row-start-1"
      cdkDropList
      [cdkDropListEnterPredicate]="enterPredicate"
      [id]="zoneId('fill')"
      (cdkDropListDropped)="onFill($event)"
    >
      <div class="lw-pane-drop-preview lw-pane-drop-preview--fill"></div>
    </div>
  }
} @else {
  @for (edge of shownEdges(); track edge) {
    <div
      [class]="'lw-pane-drop-zone ' + placement[edge]"
      cdkDropList
      [cdkDropListEnterPredicate]="enterPredicate"
      [id]="zoneId(edge)"
      (cdkDropListDropped)="onDrop(edge, $event)"
    >
      <div [class]="'lw-pane-drop-preview lw-pane-drop-preview--' + edge"></div>
    </div>
  }
}
