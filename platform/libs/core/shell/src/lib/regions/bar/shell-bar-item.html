@if (asButton(); as btn) {
  <button
    type="button"
    (click)="run(btn)"
    [disabled]="disabled()"
    [lwContextMenu]="btn.menu"
    [lwContextMenuContext]="{ targetKind: 'bar-item', id: btn.id, bar: btn.bar }"
    class="relative flex items-center gap-1 rounded px-1.5 py-0.5 text-content-faint transition-colors hover:bg-surface-overlay hover:text-content disabled:pointer-events-none disabled:opacity-40"
    [attr.aria-label]="(btn.tooltip ?? btn.label ?? '') | transloco"
  >
    @if (btn.icon; as icon) {
      <lw-icon [name]="icon" size="1rem" />
    }
    @if (btn.label; as label) {
      <span>{{ label | transloco }}</span>
    }
    @if (shortcut(); as chord) {
      <kbd
        class="rounded border border-border bg-surface-overlay px-1 text-[0.6875rem] leading-tight text-content-muted"
        >{{ chord }}</kbd
      >
    }
    @if (btn.tooltip ?? btn.label; as tip) {
      <lw-tooltip [text]="tip | transloco" [position]="tooltipPosition()" />
    }
  </button>
} @else if (asComponent(); as comp) {
  <ng-container
    *ngComponentOutlet="comp.component; injector: componentInjector()"
  ></ng-container>
}
