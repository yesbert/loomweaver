  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#FFFFFF">
    <text x="80" y="214" font-size="62" font-weight="700" letter-spacing="-1.2">Build Angular workbenches</text>
    <text x="80" y="288" font-size="62" font-weight="700" letter-spacing="-1.2">that grow with your product.</text>
    <text x="80" y="372" font-size="30" font-weight="400" fill="#C1C3C8">An open-source plugin platform: panes,</text>
