@if (module().areas.length > 0) {
  <lw-nav-tree
    [attr.current]="shown()"
    [attr.aria-label]="module().titleKey | transloco"
    (lw-nav-select)="show($event)"
    data-testid="module-nav"
  >
    @for (area of module().areas; track area.id) {
      <lw-nav-group
        [attr.label]="area.titleKey | transloco"
        [attr.key]="keyOf(area)"
        [attr.collapsed]="area.expanded === false ? '' : null"
        [attr.data-nav-area]="area.id"
      >
        @for (view of area.views; track view.path) {
          <lw-nav-item
            [attr.path]="view.path"
            [attr.icon]="view.icon"
            [attr.label]="view.titleKey | transloco"
            [attr.data-nav-view]="view.path"
          ></lw-nav-item>
        }
      </lw-nav-group>
    }
    @if (waiting()) {
      <p class="mt-auto px-2 pt-4 text-xs text-content-faint" data-testid="nav-waiting">
        {{ 'product.nav.notYet' | transloco }}
      </p>
    }
  </lw-nav-tree>
}
