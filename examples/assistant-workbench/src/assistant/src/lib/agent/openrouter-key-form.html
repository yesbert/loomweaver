<div class="flex shrink-0 flex-col gap-2 rounded-md border border-border bg-surface-raised p-3">
  <p class="text-xs text-content-muted">{{ 'assistant.panel.keyHint' | transloco }}</p>
  <input
    class="lw-field"
    type="password"
    placeholder="sk-or-v1-…"
    autocomplete="off"
    [attr.aria-label]="'assistant.panel.keyLabel' | transloco"
    [value]="draft()"
    (input)="edit($event)"
    (keydown.enter)="use()"
  />
  @if (problem()) {
    <p class="text-xs text-negative">{{ 'assistant.panel.keyProblem' | transloco }}</p>
  }
  <button type="button" class="lw-btn lw-btn--primary lw-btn--sm self-start" (click)="use()">
    {{ 'assistant.panel.useKey' | transloco }}
  </button>
</div>
